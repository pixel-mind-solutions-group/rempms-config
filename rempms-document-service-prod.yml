spring: 
  thymeleaf:
    prefix: "file:src/main/resources/template/"

  datasource:
    url: jdbc:postgresql://${POSTGRES_SERVER_ADDRESS:localhost:5432}/rempms_document_management
    username: postgres
    password: rempmsprod@123
    driverClassName: org.postgresql.Driver
  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8883/realms/PIXEL_HIRE
      
document:
  base:
    file:
      path: C:\document-data\
    font:
      path: "src/main/resources/fonts/TheSansSemiLight Plain.ttf"
  max:
    image: 4000000
    document: 50000000