spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_SERVER_ADDRESS:localhost:5432}/rempms_communication_management
    username: postgres
    password: rempmsprod@123
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none

  keycloak:
    base:
      url: http://localhost:8883

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${keycloak.base.url}/realms/PIXEL_HIRE
          jwk-set-uri: ${keycloak.base.url}/realms/PIXEL_HIRE/protocol/openid-connect/certs
